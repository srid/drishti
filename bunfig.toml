# Hoist workspace dependencies to root node_modules. The @kolu/* sources
# (cp'd from the nix store into node_modules/@kolu/* by shellHook) need
# @kolu/surface, `effect` and `@effect/platform-node` resolvable from one
# node_modules. Isolated linker would leave each workspace package's deps in
# its own node_modules — the hydrated sources would resolve nothing from root.
#
# Client-component test preload lives on the `just test` command line (app-
# scoped), not here: a root [test] entry is an agent-derivation input and
# must not absorb app-only tooling (U4.1 / fleet BUILD_ID).
[install]
linker = "hoisted"
